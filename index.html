<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a211c" />
    <title>Agentenkantoor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%232a211c'/%3E%3Crect x='1' y='1' width='6' height='4' fill='%233A6EA5'/%3E%3Crect x='2' y='2' width='4' height='2' fill='%237fd1ff'/%3E%3Crect x='3' y='5' width='2' height='1' fill='%23F28C28'/%3E%3Crect x='1' y='6' width='6' height='1' fill='%23b07a45'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Agentenkantoor</h1>
        <span id="mode-badge" class="badge" title="Nepdata. Stel STATUS_URL in src/config.ts in voor de echte stand." hidden>DEMO</span>
      </div>
      <div class="clock" aria-label="Huidige tijd in Madrid">
        <time id="clock-time">--:--</time>
        <span id="clock-date"></span>
      </div>
      <div class="counters" role="status" aria-live="polite">
        <div class="counter waiting" id="c-waiting"><span class="num">0</span><span class="lbl">Wacht op jou</span></div>
        <div class="counter working" id="c-working"><span class="num">0</span><span class="lbl">Aan het werk</span></div>
        <div class="counter error" id="c-error"><span class="num">0</span><span class="lbl">Fouten</span></div>
      </div>
      <div class="meta">
        <span id="updated">Status laden…</span>
        <button id="refresh" type="button" title="Agents en status nu opnieuw ophalen">Ververs</button>
        <button id="toggle-view" type="button" aria-pressed="false">Lijst</button>
      </div>
    </header>
    <div id="notice" class="notice" role="alert" hidden></div>
    <main>
      <div id="office-wrap">
        <canvas id="office" role="img" aria-label="Pixel-art kantoor met alle agents. Gebruik de knop Lijst voor een tabel met dezelfde informatie."></canvas>
      </div>
      <section id="list-view" aria-label="Lijstweergave" hidden></section>
    </main>
    <aside id="panel" class="panel" role="dialog" aria-labelledby="panel-title" hidden></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
